service.system.energy.label = Energy Management
service.system.energy-level.label = Energy Management Levels
service.system.energy-declaration.label = Energy Management Declarations
service.system.energy-objective.label = Energy Management Objective

system.config.energy-declaration.sources.label = Declaration Sources
system.config.energy-declaration.sources.description = Which mechanisms may declare devices to the engine. Empty uses all of them; naming one runs the site on that mechanism alone. Which mechanism wins when two of them describe the same device is fixed, not configured: your own metadata beats a contributed declaration, which beats a discovered proposal.
system.config.energy-level.blockedFraction.label = Blocked Fraction
system.config.energy-level.blockedFraction.description = Share of the day classified as blocked, used by the percentile derivation. The default of one sixth is four slots of a twenty-four hour day.
system.config.energy-level.blockedSlots.label = Blocked Slots
system.config.energy-level.blockedSlots.description = Number of dearest slots classified as blocked.
system.config.energy-level.derivation.label = Level Derivation
system.config.energy-level.derivation.description = How the four price bands are cut out of a day of prices: by a fixed number of slots per band, or by a share of the day. The two differ only when several slots carry the same price.
system.config.energy-level.derivation.option.fixed-counts = Fixed number of slots per band
system.config.energy-level.derivation.option.percentiles = Fraction of the series per band
system.config.energy-level.encouragedFraction.label = Encouraged Fraction
system.config.energy-level.encouragedFraction.description = Share of the day classified as encouraged, used by the percentile derivation. The default of one sixth is four slots of a twenty-four hour day.
system.config.energy-level.encouragedFrom.label = Encouraged From
system.config.energy-level.encouragedFrom.description = Surplus from which the current level is raised to encouraged. There is no default: until this is set, a photovoltaic surplus never raises the level and the site is reported as having no escalation threshold.
system.config.energy-level.encouragedSlots.label = Encouraged Slots
system.config.energy-level.encouragedSlots.description = Number of next cheapest slots classified as encouraged.
system.config.energy-level.overcapacityFraction.label = Overcapacity Fraction
system.config.energy-level.overcapacityFraction.description = Share of the day classified as overcapacity, used by the percentile derivation. The default of one sixth is four slots of a twenty-four hour day.
system.config.energy-level.overcapacityFrom.label = Overcapacity From
system.config.energy-level.overcapacityFrom.description = Surplus from which the current level is raised to overcapacity. Twice Encouraged From when left empty.
system.config.energy-level.overcapacitySlots.label = Overcapacity Slots
system.config.energy-level.overcapacitySlots.description = Number of cheapest slots classified as overcapacity.
system.config.energy.ackHandling.label = Acknowledgement Handling
system.config.energy.ackHandling.description = Who keeps track of commands a device has not confirmed yet: the engine, or the adapter that writes to the device.
system.config.energy.ackHandling.option.engine = Tracked by the engine
system.config.energy.ackHandling.option.adapter = Tracked by the adapter
system.config.energy.ackSuppressChangedCommands.label = Suppress Changed Commands
system.config.energy.ackSuppressChangedCommands.description = Also hold back a command that differs from the one still outstanding.
system.config.energy.ackWindow.label = Acknowledgement Window
system.config.energy.ackWindow.description = How long to wait for a device to report the value it was commanded before giving up on that command and deciding afresh.
system.config.energy.actuationSink.label = Actuation Sink
system.config.energy.actuationSink.description = Id of the actuation sink to dispatch to. Empty means the engine only logs; a writing sink is used only when it is named here.
system.config.energy.budget.label = Site Power Budget
system.config.energy.budget.description = Total power the site may draw. Left empty the engine enforces no total budget.
system.config.energy.cycleInterval.label = Evaluation Interval
system.config.energy.cycleInterval.description = How often the engine evaluates the site.
system.config.energy.eventResponsive.label = Event Responsive
system.config.energy.eventResponsive.description = Also evaluate between ticks, as soon as something relevant changes, instead of only on the fixed interval.
system.config.energy.nominalVoltage.label = Nominal Phase Voltage
system.config.energy.nominalVoltage.description = The voltage used to convert a current limit into a power, so that devices declared in amperes can be weighed against a budget in watts.
system.config.energy.phaseBudgets.label = Per Phase Budgets
system.config.energy.phaseBudgets.description = Power each phase may draw, written as phase:watts and separated by commas, for example 1:5750,2:5750,3:5750.
system.config.energy.shadow.label = Shadow Mode
system.config.energy.shadow.description = Only log what would have been done, never act on it. On for a fresh installation, so the decisions can be compared against the automation already in place before anything is handed over.
system.config.energy.shadowedAlgorithms.label = Shadowed Algorithms
system.config.energy.shadowedAlgorithms.description = Algorithms kept in shadow mode while shadow mode is off for everything else.
system.config.energy.shadowedParticipants.label = Shadowed Participants
system.config.energy.shadowedParticipants.description = Devices kept in shadow mode while shadow mode is off for everything else.
system.config.energy.staleAfter.label = Measurement Staleness Age
system.config.energy.staleAfter.description = Age at which a measurement counts as stale. Zero disables the age check, so only a measurement that cannot be read at all trips the safe state.
system.config.energy.stopped.label = Master Stop
system.config.energy.stopped.description = Halt everything: while it is engaged the engine takes no snapshot, invokes no algorithm, and enforces no device protection. Releasing it resumes normal operation.
system.config.energy.triggerDebounce.label = Trigger Debounce
system.config.energy.triggerDebounce.description = Shortest time between two evaluations triggered between ticks. Zero runs every trigger.
system.config.energy-objective.objective.label = Optimization Objective
system.config.energy-objective.objective.description = What the planner optimizes for. Leaving it unset optimizes for cost, which is what the framework did before the objective became selectable. A contributed objective is selected by its own id, which is not in this list.
system.config.energy-objective.objective.option.cost = Lowest cost
system.config.energy-objective.objective.option.self-consumption = Maximum self-consumption
system.config.energy-objective.objective.option.carbon = Lowest carbon
system.config.energy-objective.absentDataPlane.label = Objective Without Data
system.config.energy-objective.absentDataPlane.description = What happens when the selected objective has no series to rank on, for example the carbon objective on a site with no carbon source installed. The specification leaves this open; owner decision D33 settled it for this implementation. An objective that cannot be served is not offered at all, rather than silently answered with a different one.
system.config.energy-objective.absentDataPlane.option.fall-back = Optimize for cost instead, and report it
system.config.energy-objective.absentDataPlane.option.hide = Do not offer an objective whose data is missing
system.config.energy-objective.absentDataPlane.option.refuse = Plan nothing rather than optimize for something else
system.config.energy-objective.exportCarbonCredit.label = Export Carbon Credit
system.config.energy-objective.exportCarbonCredit.description = What an exported kilowatt-hour is worth to the carbon objective. The shipped rule withdraws the credit while the feed-in price is negative, on the reasoning that a negative price is the market refusing the power so the generation it would displace is never displaced. That rule rests on reasoning alone, with no source behind it, and this parameter is how it is overturned.
system.config.energy-objective.exportCarbonCredit.option.withdraw-on-negative-price = No credit while the feed-in price is negative
system.config.energy-objective.exportCarbonCredit.option.always = Credit every export, whatever the price
system.config.energy-objective.levelInput.label = Level Input
system.config.energy-objective.levelInput.description = Which series the four energy levels are cut out of: the effective consumption price, or the active objective's own ranking. Whether levels should follow the objective is open in the specification; every system behind it has only ever run price-based levels, which is what the default keeps.
system.config.energy-objective.levelInput.option.price = The consumption price
system.config.energy-objective.levelInput.option.objective = The active objective's ranking

service.system.energy-forecast.label = Energy Management Forecasts
system.config.energy-forecast.sources.label = Forecast Sources
system.config.energy-forecast.sources.description = Which source answers for which kind of forecast, written as role=source, for example solar-production=solarforecast. Roles are solar-production, temperature, cloud-cover, wind and heating-demand. Anything not named here is answered by the highest-ranked installed source.
system.config.energy-forecast.staleAfter.label = Forecast Maximum Age
system.config.energy-forecast.staleAfter.description = How old the newest run of a forecast may be before the system reports that it is planning on something old. Planning continues on what is there either way. There is no default: how long a site is happy to plan on yesterday's weather is a property of the site.
system.config.energy-objective.carbonSource.label = Carbon Source
system.config.energy-objective.carbonSource.description = Id of the carbon source to read, when more than one is installed. Empty reads the highest ranked one.

service.system.energy-plan.label = Energy Management Plan
system.config.energy-plan.refreshInterval.label = Plan Refresh Interval
system.config.energy-plan.refreshInterval.description = How often to re-derive the level plan from the current prices, forecasts and objective. There is no default. Left empty, the plan is re-derived only when the configuration changes, which means new day-ahead prices published by an already-installed source are not picked up until something else changes; the system reports that this is the case rather than leaving it to be discovered.
system.config.energy-plan.surplusForecast.label = Assemble A Surplus Forecast
system.config.energy-plan.surplusForecast.description = Whether to build a forecast of future surplus for the objectives that rank on one, by netting the solar production forecast against the heating demand forecast. Off by default because no requirement defines this quantity: with no demand forecast installed the result describes production rather than surplus, and the system says so rather than presenting an upper bound as a surplus.

service.system.energy-price.label = Energy Management Prices
system.config.energy-price.components.label = Price Components
system.config.energy-price.components.description = What your effective consumption price is made of, in the order it is summed, for example spot, gridTariff and taxesAndFees. Empty composes nothing: there is no shipped default, because a wholesale price presented as a consumer price would be wrong on every bill.
system.config.energy-price.components.option.spot = Market or day-ahead price
system.config.energy-price.components.option.gridTariff = Grid transport tariff
system.config.energy-price.components.option.taxesAndFees = Taxes, levies and fixed fees
system.config.energy-price.components.option.other = Something the other components do not describe
system.config.energy-price.preferredSources.label = Preferred Price Sources
system.config.energy-price.preferredSources.description = Which source to prefer for a price component, written as role:sourceId, for example spot:entsoe. Empty prefers the highest ranked source of each role.
system.config.energy-price.alignment.label = Component Alignment
system.config.energy-price.alignment.description = How components whose slots do not line up are brought onto one set of slots before they are summed. Refining keeps every value over exactly the time it was in force; resampling gives a regular series; refusing tells you your inputs disagree instead of composing them.
system.config.energy-price.alignment.option.union = Refine to every boundary
system.config.energy-price.alignment.option.finest = Resample onto the finest component
system.config.energy-price.alignment.option.strict = Refuse anything not already aligned
