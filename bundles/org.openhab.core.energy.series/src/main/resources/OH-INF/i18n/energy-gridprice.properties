service.system.energy-gridprice.label = Energy Management Grid Price
system.config.energy-gridprice.item.label = Price Item
system.config.energy-gridprice.item.description = The item carrying the raw future price series, as a binding publishes it. Nothing is read until this is set.
system.config.energy-gridprice.persistenceService.label = Persistence Service
system.config.energy-gridprice.persistenceService.description = Which persistence service holds the item's future series. Empty uses the default one.
system.config.energy-gridprice.role.label = Price Role
system.config.energy-gridprice.role.description = What the resulting series is, which is how the price plane knows where to use it.
system.config.energy-gridprice.role.option.spot = Market or day-ahead price
system.config.energy-gridprice.role.option.gridTariff = Grid transport tariff
system.config.energy-gridprice.role.option.taxesAndFees = Taxes, levies and fixed fees
system.config.energy-gridprice.role.option.feedIn = Price paid for energy delivered to the grid
system.config.energy-gridprice.currency.label = Currency
system.config.energy-gridprice.currency.description = The three-letter code the raw numbers are in. There is no default: an item carries a number and says nothing about its denomination, and a guessed one reaches you as a price you are about to act on. Cents are not a currency and cannot be used here; carry the price in whole units and scale it for display.
system.config.energy-gridprice.energyUnit.label = Raw Energy Unit
system.config.energy-gridprice.energyUnit.description = The unit of energy the raw numbers are per.
system.config.energy-gridprice.energyUnit.option.kWh = Per kilowatt hour
system.config.energy-gridprice.energyUnit.option.MWh = Per megawatt hour
system.config.energy-gridprice.marketZone.label = Market Time Zone
system.config.energy-gridprice.marketZone.description = The time zone of the market that produced the prices, which is what names their delivery day. It is not your own zone, and it is never inferred from it or from UTC - so there is no default, and nothing is read until you name one. A central-European day runs 23:00 to 23:00 in UTC, and reading it as a UTC day names it a day early.
system.config.energy-gridprice.horizonHours.label = Horizon
system.config.energy-gridprice.horizonHours.description = How far ahead to read the series.
system.config.energy-gridprice.pipeline.label = Adjustment Order
system.config.energy-gridprice.pipeline.description = The adjustments to apply, in the order your own bill applies them, for example fee=0.0279, vat=24. There is deliberately no fixed order: value-added tax on a price that already carries a transfer fee is a different number from a fee added afterwards.
system.config.energy-gridprice.vatPercent.label = VAT
system.config.energy-gridprice.vatPercent.description = The tax rate to add, as the percentage your bill states.
system.config.energy-gridprice.fixedFee.label = Fixed Fee
system.config.energy-gridprice.fixedFee.description = An amount added to every slot, in the currency above per the raw energy unit.
system.config.energy-gridprice.scale.label = Scale Factor
system.config.energy-gridprice.scale.description = A plain multiplier, for a source publishing a bare number in a unit nothing can name.
system.config.energy-gridprice.targetEnergyUnit.label = Effective Energy Unit
system.config.energy-gridprice.targetEnergyUnit.description = The unit of energy the effective prices should be per.
system.config.energy-gridprice.targetEnergyUnit.option.kWh = Per kilowatt hour
system.config.energy-gridprice.targetEnergyUnit.option.MWh = Per megawatt hour
system.config.energy-gridprice.tariffPeriods.label = Tariff Periods
system.config.energy-gridprice.tariffPeriods.description = Conditional tariff windows, written id;months;days;from;to;amount, for example winter-day;DEC,JAN,FEB;MON,TUE,WED,THU,FRI,SAT;07:00;22:00;0.06. Leave months or days empty for any. The times are read in your own zone, not the market's.
system.config.energy-gridprice.tariffDefault.label = Tariff Outside Every Period
system.config.energy-gridprice.tariffDefault.description = What the tariff adds where no period applies.
