service.system.energy-forecast-store.label = Energy Management Forecast Storage
system.config.energy-forecast-store.persistenceService.label = Persistence Service
system.config.energy-forecast-store.persistenceService.description = Which persistence service holds the prediction series. Empty uses the default one. It has to be a service that can change what it already stored: influxdb, inmemory, jdbc or mongodb. A service that cannot is refused rather than used, because a prediction series that can only be appended to is not the one the system needs.
system.config.energy-forecast-store.series.label = Prediction Series
system.config.energy-forecast-store.series.description = Which Item carries which kind of prediction, written as role=item, for example solar-production=PV_Forecast. Each one becomes a forecast source, so a stored baseline is used whenever no live service has anything better.
system.config.energy-forecast-store.capSeries.label = Constraint Series
system.config.energy-forecast-store.capSeries.description = Which Item holds the caps of which prediction Item, written as prediction=cap, for example PV_Forecast=PV_Forecast_Cap. Only used when caps are kept out of the prediction.
system.config.energy-forecast-store.writePolicy.label = Write Policy
system.config.energy-forecast-store.writePolicy.description = What happens when a forecast refresh lands on an entry a cap was written onto. This is deliberately unset: the requirement says a refresh replaces what was there, and the cap scenario says those entries hold the capped value, and nothing in the specification says which wins. Left unset, the newest write wins and the overwritten cap is reported.
system.config.energy-forecast-store.writePolicy.option.fresh-overwrites-old = Newest write wins, and say so
system.config.energy-forecast-store.writePolicy.option.reapply-caps = Put the cap back after every refresh
system.config.energy-forecast-store.writePolicy.option.writer-precedence = Follow the layer order below
system.config.energy-forecast-store.writePolicy.option.cap-at-read-time = Keep caps in their own series and apply them when reading
system.config.energy-forecast-store.layerPrecedence.label = Layer Order
system.config.energy-forecast-store.layerPrecedence.description = Which writer outranks which, written as layer=rank with the higher rank winning, for example cap=20. Layers are baseline, forecast, cap and learned. Only used by the layer-order write policy, which refuses to write at all until this is declared.
service.system.energy-demand.label = Energy Management Derived Demand
system.config.energy-demand.demandItem.label = Demand Item
system.config.energy-demand.demandItem.description = The Item the derived heating-demand series is published to. Empty publishes nothing: the derived series is still readable by the energy engine, it simply is not written anywhere.
system.config.energy-demand.heatLoss.label = Heat Loss
system.config.energy-demand.heatLoss.description = How much heating power the building needs per degree of difference to the outside, in kilowatts per kelvin. There is no default, because this is a property of the building. Until it is declared, no heating demand is derived at all and the system reports that rather than deriving a number nobody chose.
system.config.energy-demand.baseTemperature.label = Base Temperature
system.config.energy-demand.baseTemperature.description = The outdoor temperature below which the building needs heating.
system.config.energy-demand.solarGain.label = Solar Gain
system.config.energy-demand.solarGain.description = How much heating need one kilowatt-hour of the solar forecast displaces. It stands for the glazing and the orientation together, which is why it is useful on a site with no solar panels at all. Undeclared means a solar forecast changes nothing.
system.config.energy-demand.preheatHorizon.label = Pre-heating Horizon
system.config.energy-demand.preheatHorizon.description = How far ahead to look for a temperature drop worth pre-heating for.
system.config.energy-demand.preheatDrop.label = Pre-heating Drop
system.config.energy-demand.preheatDrop.description = How much colder the coming hours have to be before demand is pulled forward.
system.config.energy-demand.preheatShare.label = Pre-heating Share
system.config.energy-demand.preheatShare.description = How much of the coming extra need is pulled into the warmer hours, between 0 and 1.
system.config.energy-demand.preheatModel.label = Pre-heating Bookkeeping
system.config.energy-demand.preheatModel.description = Whether the energy pulled forward is added to the day or taken out of the hours it was pre-heating for. The specification asks for the rise and does not say which, so there is no default and pre-heating stays off until all four of these are declared.
system.config.energy-demand.preheatModel.option.additive = Add it to the day
system.config.energy-demand.preheatModel.option.redistributed = Move it within the day
